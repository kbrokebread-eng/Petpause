<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings | PetPause</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<!-- NFR6: a manager can change kennel capacity and the nightly rate without any code changes -->
<body>
  <header class="topbar"></header>
  <main class="wrap">
    <div class="pagehead">
      <div>
        <h1>Settings</h1>
        <div class="sub">Change these when the daycare grows or prices change.</div>
      </div>
    </div>
    <div id="formError"></div>

    <form id="settingsForm" method="post" class="card" style="max-width:560px">
      <div class="field">
        <label for="f_capacity">Kennel capacity (places per night) <span class="req">*</span></label>
        <input id="f_capacity" name="capacity" type="number" value="" required min="1" max="500">
      </div>
      <p class="help" style="margin-top:-8px">New bookings are blocked on any night that would go over this number.</p>
      <div class="field">
        <label for="f_nightly_rate">Nightly rate (R) <span class="req">*</span></label>
        <input id="f_nightly_rate" name="nightly_rate" type="number" value="" required min="0" step="0.01">
      </div>
      <p class="help" style="margin-top:-8px">Used for the revenue estimate on the weekly report.</p>
      <div class="actions" style="margin-top:14px">
        <button class="btn pri" type="submit">Save settings</button>
      </div>
    </form>
  </main>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/settings.js"></script>
</body>
</html>
