<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password | PetPause</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<!--
  FR1 / NFR2: staff choose their own password. Anyone given a temporary password by a manager
  is sent here at first log-in and can't use the system until they've changed it.
-->
<body class="bare">
  <div class="login">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true">
        <circle cx="6" cy="9" r="2"/><circle cx="10" cy="5.3" r="2"/><circle cx="14" cy="5.3" r="2"/><circle cx="18" cy="9" r="2"/>
        <path d="M7.3 17.6c0-3.3 2.2-5.8 4.7-5.8s4.7 2.5 4.7 5.8c0 2.1-1.9 2.6-4.7 2.6s-4.7-.5-4.7-2.6z"/>
      </svg>
      <span>PetPause<small>Records &amp; Bookings</small></span>
    </div>
    <div class="card">
      <h1 id="heading">Change password</h1>
      <p class="muted" id="intro">Choose a new password for <strong id="who"></strong>.</p>
      <div id="note"></div>
      <div id="error"></div>
      <form id="pwForm" method="post">
        <div class="field">
          <label for="f_current">Current password <span class="req">*</span></label>
          <input id="f_current" name="current" type="password" value="" required autocomplete="current-password">
        </div>
        <div class="field">
          <label for="f_password">New password <span class="req">*</span></label>
          <input id="f_password" name="password" type="password" value="" required autocomplete="new-password">
        </div>
        <div class="field">
          <label for="f_password2">Confirm new password <span class="req">*</span></label>
          <input id="f_password2" name="password2" type="password" value="" required autocomplete="new-password">
        </div>
        <p class="help">At least 10 characters with an upper-case letter, a lower-case letter, a number and a symbol.
          It can't contain your username.</p>
        <button class="btn pri" type="submit">Save new password</button>
      </form>
      <p class="help" style="margin-top:14px" id="back"><a href="/dashboard">Back to dashboard</a></p>
      <p class="help" style="margin-top:14px"><a href="/logout">Log out</a></p>
    </div>
  </div>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/change-password.js"></script>
</body>
</html>
